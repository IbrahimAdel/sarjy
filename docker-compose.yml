services:
  backend:
    build:
      context: ./backend
    image: sarjy-backend:latest
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: sqlite:///./data/sarjy_memory.db
      # TTS models (Piper + Kokoro) are baked into the image under
      # /app/data. On first start they are seeded from the image into the
      # named volume below.
    ports:
      - "8000:8000"
    volumes:
      - sarjy-data:/app/data
      # Optional: override with a local Piper voice model for TTS
      # - ./models/piper:/app/data/piper:ro
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    image: sarjy-frontend:latest
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  sarjy-data:
