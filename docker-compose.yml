services:
  backend:
    build:
      context: ./backend
    image: sarjy-backend:latest
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: sqlite:////app/data/sarjy_memory.db
      # Uncomment after mounting a Piper voice below:
      # PIPER_VOICE_PATH: /app/data/piper/en_US-amy-medium.onnx
    ports:
      - "8000:8000"
    volumes:
      - sarjy-data:/app/data
      # Optional: mount a local Piper voice model for TTS
      # - ./models/piper:/app/data/piper:ro
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    image: sarjy-frontend:latest
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  sarjy-data:
