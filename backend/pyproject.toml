[project]
name = "sarjy"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "bcrypt>=5.0.0",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "faster-whisper>=1.2.1",
    "greenlet>=3.5.6",
    "httpx2>=2.13.0",
    "joserfc>=1.7.5",
    "kokoro-onnx>=0.6.1",
    "numpy>=2.5.3",
    "openai>=3.14.1",
    "piper-tts>=1.8.0",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.54",
    "uvicorn[standard]>=0.53.0",
    "webrtcvad-wheels>=2.0.14",
]

[dependency-groups]
dev = [
    "basedpyright>=1.38.0",
    "pre-commit>=4.0.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.0",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]

[tool.basedpyright]
typeCheckingMode = "standard"
pythonVersion = "3.12"

reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportMissingTypeStubs = "none"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
