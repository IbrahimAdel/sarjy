[project]
name = "sarjy"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "fastapi>=0.141.1",
    "faster-whisper>=1.2.1",
    "greenlet>=3.5.6",
    "httpx2>=2.13.0",
    "numpy>=2.5.3",
    "openai>=3.14.1",
    "piper-tts>=1.8.0",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.54",
    "uvicorn[standard]>=0.53.0",
    "webrtcvad-wheels>=2.0.14",
]

[dependency-groups]
dev = [
    "basedpyright>=1.38.0",
    "pre-commit>=4.0.0",
    "ruff>=0.15.0",
]

[tool.basedpyright]
typeCheckingMode = "standard"
pythonVersion = "3.12"

reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportMissingTypeStubs = "none"
